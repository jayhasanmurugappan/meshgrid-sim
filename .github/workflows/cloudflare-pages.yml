# MANUAL deploy only (Actions tab > Run workflow). Needs two repo secrets:
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Nothing deploys on merge or push.
name: Deploy to Cloudflare Pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (static files only)
        run: |
          mkdir site
          cp index.html styles.css config.js gate.js app.js robots.txt _headers site/
      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site --project-name=meshgrid-sim --branch=main
